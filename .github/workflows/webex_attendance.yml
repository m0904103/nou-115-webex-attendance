name: 空大115上 視訊面授雲端自動替身排程

on:
  schedule:
    # 下午 14:00 課程非整點提前防護排程 (台北時間 13:33, 13:46, 13:56 / UTC 05:33, 05:46, 05:56)
    - cron: '33 5 * * *'
    - cron: '46 5 * * *'
    - cron: '56 5 * * *'
    # 夜間 19:00 課程非整點提前防護排程 (台北時間 18:33, 18:46, 18:56 / UTC 10:33, 10:46, 10:56)
    - cron: '33 10 * * *'
    - cron: '46 10 * * *'
    - cron: '56 10 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: '執行模式 (auto: 自動依排程, test: 45秒快速測試)'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - test

# 確保同一時段會議不會被重複觸發覆蓋，而是排隊安全互鎖
concurrency:
  group: webex-attendance-guardian
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  attend_webex:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: 檢出儲存庫程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 3.11 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安裝相依套件與 Playwright 瀏覽器核心
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: 執行空大視訊面授雲端自動出席任務
        run: |
          if [ "${{ github.event.inputs.mode }}" == "test" ]; then
            python webex_bot.py --test
          else
            python webex_bot.py --auto
          fi

      - name: 上傳上課出席存證截圖至 Actions Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: attendance-proof-screenshot
          path: |
            *.png
            *.log
          retention-days: 30

      - name: 自動發布最新出勤存證截圖至 GitHub 儲存庫 (儀表板實時顯示)
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add attendance_proof*.png || true
          if git diff --staged --quiet; then
            echo "無新截圖更新，略過發布"
          else
            git commit -m "📸 [面授出勤存證] 自動歸檔視訊面授出席最新實況截圖 [skip ci]"
            git pull --rebase origin main || true
            git push origin main || true
          fi
