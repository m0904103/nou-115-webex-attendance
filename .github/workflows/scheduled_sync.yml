name: 空大115上 官方學務數據定時查核與即時同步

on:
  schedule:
    # 每天固定每 4 小時自動巡檢與核實數據 (配合 20 天滿分穩健推進計劃)
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync_nou_status:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出儲存庫
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 執行官方數據核實與自動推進 (20天350h滿分計劃)
        run: |
          python sync_nou_status.py --auto-accumulate

      - name: 提交並推送最新數據至 GitHub Pages
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(sync): 官方學務在線時數穩健查核同步 [$(date '+%Y-%m-%d %H:%M:%S')]"
            git push origin main
          fi
